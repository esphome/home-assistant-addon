name: Lint
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1
      - name: 🛠 Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - name: 🛠 Install dependencies
        run: pip install -r script/requirements_test.txt
      - name: 🧪 Run tests
        run: pytest tests

  build:
    name: App configuration
    runs-on: ubuntu-latest
    strategy:
      matrix:
        channels:
          - folder: esphome
            channel: stable
          - folder: esphome-beta
            channel: beta
          - folder: esphome-dev
            channel: dev
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1
      - name: 🛠 Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - name: 🛠 Install dependencies
        run: pip install -r script/requirements.txt
      - name: 🛠 Generate files from template
        run: python script/generate.py ${{ matrix.channels.channel }}
      - name: 🚀 Run Home Assistant App Lint on ${{ matrix.channels.channel }}
        uses: frenck/action-app-linter@v2.21.2
        with:
          path: "./${{ matrix.channels.folder }}"
